<!DOCTYPE html>
<!-- Khai báo đây là tài liệu HTML5 -->
<html lang="vi">
<head>
  <!-- Bảng mã UTF-8 để hiển thị đúng tiếng Việt có dấu -->
  <meta charset="UTF-8">
  <!-- Giúp trang hiển thị vừa khít màn hình điện thoại -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tiêu đề hiện trên tab trình duyệt -->
  <title>Giới thiệu - Green Soil</title>
  <!-- MỚI: favicon, icon nhỏ trên tab trình duyệt (dùng logo Green Soil) -->
  <link rel="icon" type="image/png" href="images/Logo-Green.png">

  <!-- Nếu lần trước đã lưu link banner thì báo trình duyệt tải ảnh NGAY, không đợi Supabase -->
  <script>
    try {
      // Lấy link banner đã lưu trong bộ nhớ trình duyệt
      var cachedBanner = localStorage.getItem('gt_banner_url');
      if (cachedBanner) {
        // Tạo thẻ <link rel="preload"> để tải trước ảnh
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = cachedBanner;
        document.head.appendChild(l);
      }
    } catch (e) {}
  </script>

  <!-- Nhúng file CSS chung của website -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Kết nối trước tới Google Fonts để tải font nhanh hơn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font Be Vietnam Pro (hỗ trợ tiếng Việt đẹp) -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Các class bắt đầu bằng gt- chỉ dành cho trang Giới thiệu, không đụng style.css */

    /* Khung banner đầu trang: nền xám xanh trùng màu ảnh banner */
    .gt-hero { position:relative; min-height:380px; display:flex; align-items:center; justify-content:center;
      text-align:center; color:#fff; background-color:#94a691; background-size:cover;
      background-position:center; background-repeat:no-repeat; }
    /* Lớp phủ tối nhẹ để chữ dễ đọc trên ảnh */
    .gt-hero::before { content:""; position:absolute; inset:0; background:rgba(0,40,10,.4); }
    /* Phần chữ nằm trên lớp phủ */
    .gt-hero-inner { position:relative; max-width:760px; padding:60px 24px; }
    .gt-hero h1 { font-size:2.6rem; margin:0 0 12px; line-height:1.25; }
    .gt-hero p  { font-size:1.15rem; margin:0 0 28px; opacity:.95; }
    /* Nút "Xem sản phẩm" trong banner */
    .gt-btn { display:inline-block; background:#fff; color:#2e7d32; font-weight:600; padding:14px 32px;
      border-radius:999px; text-decoration:none; box-shadow:0 6px 16px rgba(0,0,0,.2); transition:transform .2s; }
    .gt-btn:hover { transform:translateY(-2px); }

    /* Khung nội dung chung, căn giữa và giới hạn chiều rộng */
    .gt-wrap { max-width:1100px; margin:0 auto; padding:64px 24px; }
    .gt-title { text-align:center; color:#2e7d32; font-size:1.9rem; margin:0 0 36px; }

    /* Phần câu chuyện: 2 cột (ảnh + chữ); no-img = chỉ có chữ ở giữa */
    .gt-story { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; }
    .gt-story.no-img { grid-template-columns:1fr; max-width:760px; margin:0 auto; }
    .gt-story img { width:100%; border-radius:20px; box-shadow:0 10px 28px rgba(0,0,0,.12); }
    .gt-story h2 { color:#2e7d32; font-size:1.8rem; margin:0 0 16px; }
    .gt-story p  { line-height:1.8; white-space:pre-line; margin:0; }

    /* Phần giá trị cốt lõi: nền xanh nhạt, 3 thẻ ngang hàng */
    .gt-values-bg { background:#f3f8f3; }
    .gt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
    .gt-card { background:#fff; border-radius:20px; padding:32px 24px; text-align:center;
      box-shadow:0 6px 20px rgba(0,0,0,.07); transition:transform .25s; }
    .gt-card:hover { transform:translateY(-6px); }
    .gt-icon { font-size:2.8rem; margin-bottom:12px; }
    .gt-card h3 { color:#2e7d32; margin:0 0 10px; }
    .gt-card p  { margin:0; line-height:1.6; }

    /* Màn hình điện thoại: xếp các cột thành 1 cột */
    @media (max-width:760px) {
      .gt-story, .gt-grid { grid-template-columns:1fr; }
      .gt-hero h1 { font-size:2rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER: giống index.html, chỉ đổi link để quay về trang chủ -->
  <header class="header">
    <!-- Logo: bấm vào về trang chủ (MỚI: alt mô tả đầy đủ, tốt cho SEO) -->
    <a href="index.html" class="logo"><img src="images/Logo-Green.png" alt="Green Soil - Canh tác bền vững, giữ trọn màu xanh"></a>
    <!-- Menu điều hướng -->
    <nav class="menu">
      <a href="index.html#san-pham">Sản phẩm</a>
      <a href="gioi-thieu.html">Giới thiệu</a>
      <a href="index.html#lien-he">Liên hệ</a>
      <!-- Nút giỏ hàng: id="cart-open" để main.js mở khung giỏ hàng -->
      <a href="#" id="cart-open" class="cart-btn">Giỏ hàng (<span id="cart-count">0</span>)</a>
      <!-- Nút vào trang admin: icon ổ khóa -->
      <a href="admin-login.html" class="admin-btn" title="Quản trị" aria-label="Vào trang quản trị">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- Thân ổ khóa và quai ổ khóa -->
          <rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </a>
    </nav>
  </header>

  <main>
    <!-- 1. BANNER: chữ được JavaScript điền vào theo thuộc tính data-about -->
    <section class="gt-hero" id="gt-hero">
      <div class="gt-hero-inner">
        <h1 data-about="about_banner_title"></h1>
        <p data-about="about_banner_subtitle"></p>
        <a class="gt-btn" id="gt-btn" href="index.html#san-pham" data-about="about_banner_btn_text"></a>
      </div>
    </section>

    <!-- Gán ảnh banner đã lưu từ lần trước ngay lập tức (chạy trước khi trang vẽ xong) -->
    <script>
      try {
        var cb = localStorage.getItem('gt_banner_url');
        if (cb) document.getElementById('gt-hero').style.backgroundImage = 'url("' + cb + '")';
      } catch (e) {}
    </script>

    <!-- 2. CÂU CHUYỆN THƯƠNG HIỆU: có ảnh thì chia 2 cột, không có thì chỉ hiện chữ -->
    <section class="gt-wrap">
      <div class="gt-story no-img" id="gt-story">
        <img id="gt-story-img" alt="Câu chuyện thương hiệu" style="display:none;">
        <div>
          <h2 data-about="about_story_title"></h2>
          <p data-about="about_story_text"></p>
        </div>
      </div>
    </section>

    <!-- 3. GIÁ TRỊ CỐT LÕI (3 thẻ) -->
    <section class="gt-values-bg">
      <div class="gt-wrap">
        <h2 class="gt-title" data-about="about_values_title"></h2>
        <div class="gt-grid">
          <!-- Thẻ 1 -->
          <div class="gt-card"><div class="gt-icon" data-about="about_v1_icon"></div><h3 data-about="about_v1_title"></h3><p data-about="about_v1_desc"></p></div>
          <!-- Thẻ 2 -->
          <div class="gt-card"><div class="gt-icon" data-about="about_v2_icon"></div><h3 data-about="about_v2_title"></h3><p data-about="about_v2_desc"></p></div>
          <!-- Thẻ 3 -->
          <div class="gt-card"><div class="gt-icon" data-about="about_v3_icon"></div><h3 data-about="about_v3_title"></h3><p data-about="about_v3_desc"></p></div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER: main.js tự điền hotline / địa chỉ từ bảng site_content -->
  <footer id="lien-he" class="footer">
    <p data-content="contact" style="white-space:pre-line;"></p>
    <p>Hotline: <span data-content="hotline">0xxx xxx xxx</span> | Địa chỉ: <span data-content="address">...</span></p>
  </footer>

  <!-- Thư viện Supabase: PHẢI nằm trên main.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- main.js dùng cho giỏ hàng + footer -->
  <script src="js/main.js"></script>

  <script>
  (function () {
    // Địa chỉ và khóa công khai của Supabase
    const URL_ = 'https://aynmosrddjceqexblqeo.supabase.co';
    const KEY_ = 'sb_publishable_T7sRdOKCm3ZKQJZWyGxMmg_5XB1yE59';

    // Nội dung mặc định: hiện khi admin chưa nhập hoặc chưa tải được dữ liệu
    const DEFAULTS = {
      about_banner_title: 'Green Soil - Đất sinh học cho khu vườn xanh',
      about_banner_subtitle: 'Nuôi dưỡng cây trồng bằng sự tử tế với thiên nhiên.',
      about_banner_btn_text: 'Xem sản phẩm',
      about_banner_btn_link: 'index.html#san-pham',
      about_story_title: 'Câu chuyện của chúng tôi',
      about_story_text: 'Green Soil bắt đầu từ mong muốn mang lại loại đất sạch, giàu dinh dưỡng cho mọi khu vườn.',
      about_values_title: 'Giá trị cốt lõi',
      about_v1_icon: '🌱', about_v1_title: 'Tự nhiên',  about_v1_desc: 'Nguyên liệu hữu cơ, an toàn cho cây và người.',
      about_v2_icon: '✅', about_v2_title: 'Chất lượng', about_v2_desc: 'Kiểm soát chặt chẽ từng lô sản phẩm.',
      about_v3_icon: '♻️', about_v3_title: 'Bền vững',  about_v3_desc: 'Hướng tới canh tác thân thiện với môi trường.'
    };

    // Chỉ cho phép link an toàn (chặn javascript:)
    function safeLink(u) { return /^\s*javascript:/i.test(u || '') ? '#' : u; }

    // fromServer = true khi dữ liệu lấy từ Supabase (dùng để cập nhật bộ nhớ đệm banner)
    function render(rows, fromServer) {
      // Lấy giá trị theo khóa; nếu trống thì dùng nội dung mặc định
      const get = k => ((rows[k] || '').trim()) || DEFAULTS[k] || '';

      // Gán chữ vào mọi thẻ có data-about (dùng textContent nên không bị chèn mã độc)
      document.querySelectorAll('[data-about]').forEach(el => { el.textContent = get(el.dataset.about); });

      // Nút banner: gán link đã lọc an toàn
      document.getElementById('gt-btn').href = safeLink(get('about_banner_btn_link'));

      // Ảnh nền banner
      const bg = (rows.about_banner_image || '').trim();
      if (bg) {
        const url = encodeURI(bg);
        document.getElementById('gt-hero').style.backgroundImage = `url("${url}")`;
        // Lưu lại để lần sau hiện banner ngay lập tức
        if (fromServer) { try { localStorage.setItem('gt_banner_url', url); } catch (e) {} }
      } else if (fromServer) {
        // Admin đã xóa ảnh banner -> xóa bộ nhớ đệm và bỏ ảnh cũ
        try { localStorage.removeItem('gt_banner_url'); } catch (e) {}
        document.getElementById('gt-hero').style.backgroundImage = '';
      }

      // Ảnh câu chuyện: có ảnh thì chia 2 cột, không có thì chỉ hiện chữ ở giữa
      const img = document.getElementById('gt-story-img');
      const src = (rows.about_story_image || '').trim();
      if (src) {
        img.src = src; img.style.display = 'block';
        document.getElementById('gt-story').classList.remove('no-img');
      }
    }

    render({}, false); // vẽ nội dung mặc định ngay, tránh trang trống (không đụng tới ảnh đã lưu)

    // Tải nội dung thật từ Supabase (các dòng có key bắt đầu bằng about_)
    (async function () {
      try {
        const c = window.supabase.createClient(URL_, KEY_);
        const { data, error } = await c.from('site_content').select('key, value').like('key', 'about_%');
        if (error) throw error;
        // Chuyển danh sách dòng thành object {key: value}
        const rows = {};
        data.forEach(r => { rows[r.key] = r.value; });
        render(rows, true);
      } catch (e) { console.error('Lỗi tải trang giới thiệu:', e.message || e); }
    })();
  })();
  </script>
</body>
</html>
